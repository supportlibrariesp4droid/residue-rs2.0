[package]
name = "wide-primes"
version = "0.0.0"
edition = "2021"
publish = false
description = "Phase 0 experiment: are primes wider than 31 bits worth it for residue-rs?"

[dependencies]
residue = { package = "residue-rs", path = "../..", default-features = false, features = ["std"] }
num-bigint = "0.4"
num-traits = "0.2"

[profile.release]
lto = true
codegen-units = 1
