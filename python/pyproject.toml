[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "residue-rs"
description = "Exact integer arithmetic in a Residue Number System: big-integer vectors, matrices and batched modular exponentiation, in Rust."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Pietro Maria Piazza", email = "supportlibrariesp4@gmail.com" }]
requires-python = ">=3.11"
keywords = ["rns", "bignum", "modular", "crt", "linear-algebra"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest", "hypothesis", "numpy"]

[project.urls]
Repository = "https://github.com/supportlibrariesp4droid/residue-rs2.0"

[tool.maturin]
features = ["pyo3/extension-module"]
strip = true
