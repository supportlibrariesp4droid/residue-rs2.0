[package]
name = "residue-py"
version = "2.0.0"
edition = "2021"
rust-version = "1.97"
authors = ["Pietro Maria Piazza <supportlibrariesp4@gmail.com>"]
license = "Apache-2.0"
description = "Python bindings for residue-rs: exact integer arithmetic in a Residue Number System."
publish = false

[lib]
name = "residue_rs"
crate-type = ["cdylib"]

[dependencies]
residue = { package = "residue-rs", path = "..", features = ["std", "num-bigint", "parallel"] }
pyo3 = { version = "0.30", features = ["abi3-py311", "num-bigint"] }
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
